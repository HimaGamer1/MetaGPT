# Megan default configuration.
# This file lets the framework boot without a "real" API key — Megan's
# Streamlit UI replaces these values at runtime with the keys the user
# enters in the API-keys tab. Do NOT commit a real key here.
llm:
  api_type: "openai"
  model: "gpt-4o-mini"
  base_url: "https://api.openai.com/v1"
  api_key: "sk-megan-placeholder-set-via-ui"
